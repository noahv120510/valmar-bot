<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Valmar Bot</title>
<style>
  :root { --bg: #0f172a; --card: #1e293b; --input: #0f172a; --border: #334155; --text: #e2e8f0; --muted: #94a3b8; --accent: #3b82f6; --ok: #22c55e; --err: #f87171; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  main { max-width: 760px; margin: 0 auto; padding: 32px 16px; }
  h1 { margin: 0 0 24px; font-size: 28px; }
  h2 { margin: 0 0 16px; font-size: 20px; }
  .card { background: var(--card); border-radius: 12px; padding: 24px; margin-bottom: 20px; }
  form { display: flex; gap: 10px; flex-wrap: wrap; }
  input { flex: 1 1 220px; padding: 12px 14px; background: var(--input); color: var(--text); border: 1px solid var(--border); border-radius: 8px; font-size: 16px; }
  button { padding: 12px 22px; background: var(--accent); color: #fff; border: 0; border-radius: 8px; font-size: 16px; font-weight: 600; cursor: pointer; }
  button:disabled { opacity: .6; cursor: default; }
  #status { margin-top: 14px; min-height: 24px; }
  .ok { color: var(--ok); } .err { color: var(--err); }
  .muted { color: var(--muted); font-size: 14px; }
  .call { border-top: 1px solid var(--border); padding: 14px 0; }
  .call:first-child { border-top: 0; padding-top: 0; }
  .call-head { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
  .live { color: var(--ok); font-weight: 600; }
  .line { margin: 6px 0 0; }
  .who { font-weight: 600; color: var(--muted); }
  details summary { cursor: pointer; color: var(--muted); font-size: 14px; margin-top: 6px; }
</style>
</head>
<body>
<main>
  <h1>Valmar Bot</h1>

  <section class="card">
    <h2>Make a call</h2>
    <form id="call-form">
      <input id="phone" type="tel" placeholder="+1 716 555 1234" autocomplete="tel" required>
      <button id="call-btn" type="submit">Call</button>
    </form>
    <div id="status"></div>
    <p class="muted">Opens with your pitch in your ElevenLabs voice, then Claude handles the conversation.</p>
  </section>

  <section class="card">
    <h2>Recent calls</h2>
    <div id="calls" class="muted">No calls yet.</div>
  </section>
</main>
<script>
  const form = document.getElementById('call-form');
  const phone = document.getElementById('phone');
  const btn = document.getElementById('call-btn');
  const status = document.getElementById('status');
  const callsEl = document.getElementById('calls');

  function setStatus(text, cls) { status.textContent = text; status.className = cls || ''; }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    btn.disabled = true;
    setStatus('Dialing…');
    try {
      const res = await fetch('/api/call', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ phone_number: phone.value }),
      });
      const data = await res.json();
      if (data.success) setStatus(`Calling ${data.to}…`, 'ok');
      else setStatus(`Error: ${data.error}`, 'err');
    } catch (err) {
      setStatus('Error: could not reach the bot. Is npm start still running?', 'err');
    } finally {
      btn.disabled = false;
    }
  });

  function el(tag, cls, text) { const n = document.createElement(tag); if (cls) n.className = cls; if (text != null) n.textContent = text; return n; }

  function renderCalls(calls) {
    if (!calls.length) { callsEl.textContent = 'No calls yet.'; callsEl.className = 'muted'; return; }
    callsEl.className = '';
    callsEl.replaceChildren(...calls.map((c) => {
      const wrap = el('div', 'call');
      const head = el('div', 'call-head');
      head.append(el('strong', null, c.to ? `+${String(c.to).replace(/^\+/, '')}` : 'Unknown'));
      const meta = c.active
        ? el('span', 'live', 'Live now')
        : el('span', 'muted', `${new Date(c.startedAt).toLocaleString()} · ${c.durationSeconds || 0}s${c.doNotCall ? ' · do not call' : ''}`);
      head.append(meta);
      wrap.append(head);
      const details = el('details');
      if (c.active) details.open = true;
      details.append(el('summary', null, `Transcript (${c.transcript.length} lines)`));
      for (const t of c.transcript) {
        const p = el('p', 'line');
        p.append(el('span', 'who', t.speaker === 'bot' ? 'Bot: ' : 'Them: '), document.createTextNode(t.text));
        details.append(p);
      }
      wrap.append(details);
      return wrap;
    }));
  }

  let openStates = {};
  async function refresh() {
    try {
      callsEl.querySelectorAll('details').forEach((d, i) => { openStates[i] = d.open; });
      const res = await fetch('/api/calls');
      renderCalls(await res.json());
      callsEl.querySelectorAll('details').forEach((d, i) => { if (openStates[i]) d.open = true; });
    } catch (_) {}
  }
  refresh();
  setInterval(refresh, 3000);
</script>
</body>
</html>
